<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #1a1a1a;
        padding: 0;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #dddada;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
      }
      h2 {
        color: #112423;
        text-align: center;
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
        background-color: #e2dddd;
        border: 1px solid black;
      }
      button {
        background-color: #1b81da;
        color: #fff;
        padding: 10px;
        border-radius: 5px;
        font-weight: 900;
      }
      button:hover {
        background-color: #070bf7;
      }
      p {
        text-align: center;
      }
      a {
        color: #1b81da;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      label {
        padding-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <form action="#">
        <h2>Sign Up</h2>
        <label for="FirstName">First Name :</label>
        <input
          type="text"
          name="FirstName"
          id="FirstName"
          placeholder="First Name"
        />
        <label for="LastName">Last Name :</label>
        <input
          type="text"
          name="LastName"
          id="LastName"
          placeholder="Last Name"
        />
        <label for="Email">Email :</label>
        <input
          type="email"
          name="Email"
          id="Email"
          placeholder="Email Address"
        />
        <label for="Password">Password :</label>
        <input
          type="password"
          name="Password"
          id="Password"
          placeholder="Password"
        />
        <p>
          Already have an account?
          <a style="font-weight: 700" href="../02_login_Project/index.html">
            Login
          </a>
        </p>
        <button>Submit</button>
      </form>
    </div>
  </body>
</html>
